name: Phase 0 quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: ./scripts/verify.sh
