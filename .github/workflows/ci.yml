name: Phase 0 quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: ./scripts/verify.sh

  # SIW Agent on its Linux target (ADR 0045): shell tests, a real systemd user service, the .deb.
  agent-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Build the app and its .deb
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles deb
      - name: Test the shell
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Install, stop and remove a real user service
        working-directory: apps/desktop/src-tauri
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          cargo test -- --ignored service_lifecycle
