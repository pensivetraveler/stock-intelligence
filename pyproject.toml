[project]
name = "stock-intelligence-workstation"
version = "0.4.0.dev0"
description = "Local-first stock intelligence workstation Phase 0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "exchange-calendars>=4.13.2,<5",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "pyarrow>=25.0.1,<26",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["services", "tests/contracts"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
