[package]
name = "stock-intelligence-workstation"
version = "0.4.0-dev"
description = "SIW Agent desktop shell (paper-trading runner control)"
edition = "2021"

[lib]
name = "stock_intelligence_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
